<body>
<div id="favs"></div>

<script type="module">
import { getFavs } from "./js/storage/storage.js";
import { getShowById } from "./js/service/api.js";

const favs = getFavs();
const container = document.getElementById("favs");

for (let id of favs) {
    const show = await getShowById(id);

    const div = document.createElement("div");
    div.innerHTML = `
        <h3>${show.name}</h3>
        <img src="${show.image?.medium}">
    `;

    container.appendChild(div);
}
</script>
</body>
